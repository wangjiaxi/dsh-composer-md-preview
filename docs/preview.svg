<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The native input box holding the rendered Markdown and its tool row, with the raw draft replaced by the rendering; a sent message above renders the same way">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- Sent message: rendered heading and bullets inside its own bubble -->
  <rect x="300" y="18" width="264" height="74" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="318" y="32" width="108" height="9" rx="4.5" fill="#39424f"/>
  <circle cx="323" cy="53" r="2.6" fill="#8a97a8"/>
  <rect x="333" y="49.4" width="150" height="7" rx="3.5" fill="#c2cbd8"/>
  <circle cx="323" cy="68" r="2.6" fill="#8a97a8"/>
  <rect x="333" y="64.4" width="94" height="7" rx="3.5" fill="#c2cbd8"/>
  <rect x="433" y="63" width="52" height="9" rx="4.5" fill="#55637a"/>

  <!-- The native input box: it shows the rendering, not the raw source -->
  <rect x="76" y="104" width="488" height="178" rx="18" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>

  <circle cx="100" cy="136" r="3" fill="#8a97a8"/>
  <rect x="112" y="132" width="180" height="8" rx="4" fill="#c2cbd8"/>
  <circle cx="100" cy="158" r="3" fill="#8a97a8"/>
  <rect x="112" y="154" width="120" height="8" rx="4" fill="#55637a"/>
  <rect x="94" y="174" width="272" height="30" rx="8" fill="#eef2f7" stroke="#e1e7ef"/>
  <rect x="104" y="182" width="124" height="6" rx="3" fill="#a8b6c8"/>
  <rect x="104" y="193" width="86" height="6" rx="3" fill="#a8b6c8"/>
  <rect x="392" y="132" width="150" height="8" rx="4" fill="#d6dde7"/>
  <rect x="392" y="148" width="110" height="8" rx="4" fill="#d6dde7"/>

  <!-- The composer's own tool row stays where it is -->
  <circle cx="104" cy="243" r="12" fill="#f1f3f6"/>
  <path d="M104 237v12m-6-6h12" stroke="#63758c" stroke-width="2" stroke-linecap="round"/>
  <rect x="128" y="235" width="104" height="16" rx="8" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>
  <circle cx="210" cy="243" r="3" fill="#8a97a8"/>
  <rect x="332" y="235" width="42" height="16" rx="6" fill="#e7edf5"/>
  <rect x="340" y="239" width="18" height="5" rx="2.5" fill="#63758c"/>
  <circle cx="364" cy="243" r="2.6" fill="#4D6BFE"/>
  <circle cx="534" cy="243" r="15" fill="#e7edf5"/>
  <path d="M534 250v-14m-5 5 5-5 5 5" fill="none" stroke="#63758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
