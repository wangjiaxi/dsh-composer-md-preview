<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="One fused input box: the rendered Markdown occupies its upper half and the raw draft with the send button its lower half, under a sent message that renders the same way">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- Sent message: rendered heading and bullets inside its own bubble -->
  <rect x="300" y="18" width="264" height="74" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="318" y="32" width="108" height="9" rx="4.5" fill="#39424f"/>
  <circle cx="323" cy="53" r="2.6" fill="#8a97a8"/>
  <rect x="333" y="49.4" width="150" height="7" rx="3.5" fill="#c2cbd8"/>
  <circle cx="323" cy="68" r="2.6" fill="#8a97a8"/>
  <rect x="333" y="64.4" width="94" height="7" rx="3.5" fill="#c2cbd8"/>
  <rect x="433" y="63" width="52" height="9" rx="4.5" fill="#55637a"/>

  <!-- The fused input box: one rounded surface for the rendering and the editing line -->
  <rect x="76" y="104" width="488" height="178" rx="18" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>

  <!-- Upper half: rendered Markdown -->
  <circle cx="100" cy="130" r="3" fill="#8a97a8"/>
  <rect x="112" y="126" width="184" height="8" rx="4" fill="#c2cbd8"/>
  <circle cx="100" cy="150" r="3" fill="#8a97a8"/>
  <rect x="112" y="146" width="132" height="8" rx="4" fill="#55637a"/>
  <rect x="94" y="162" width="272" height="30" rx="8" fill="#eef2f7" stroke="#e1e7ef"/>
  <rect x="104" y="170" width="124" height="6" rx="3" fill="#a8b6c8"/>
  <rect x="104" y="181" width="86" height="6" rx="3" fill="#a8b6c8"/>
  <rect x="392" y="126" width="150" height="8" rx="4" fill="#d6dde7"/>
  <rect x="392" y="142" width="110" height="8" rx="4" fill="#d6dde7"/>

  <!-- The joint where the rendering ends and the raw draft begins -->
  <path d="M94 206h452" stroke="#edf1f6" stroke-width="1.5"/>

  <!-- Lower half: the raw draft still being edited -->
  <rect x="96" y="222" width="22" height="7" rx="3.5" fill="#7e8b9d"/>
  <rect x="124" y="222" width="84" height="7" rx="3.5" fill="#c6cfdb"/>
  <rect x="214" y="222" width="30" height="7" rx="3.5" fill="#7e8b9d"/>
  <rect x="96" y="238" width="118" height="7" rx="3.5" fill="#c6cfdb"/>
  <rect x="96" y="254" width="62" height="7" rx="3.5" fill="#c6cfdb"/>
  <rect x="164" y="253" width="2" height="12" rx="1" fill="#4D6BFE"/>
  <circle cx="534" cy="245" r="17" fill="#e7edf5"/>
  <path d="M534 253v-16m-6 6 6-6 6 6" fill="none" stroke="#63758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
